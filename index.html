<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>WALKAI V7 — Istanbul</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111;
  font-family:Inter,Arial,sans-serif;
  color:#151515;
  overflow:hidden
}

.app{
  max-width:430px;
  margin:auto;
  height:100dvh;
  background:#f4f1eb;
  display:flex;
  flex-direction:column;
  overflow:hidden
}

header{
  height:58px;
  flex:0 0 58px;
  background:#111;
  color:#fff;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  z-index:10
}

.logo{
  font-weight:900;
  font-size:21px;
  letter-spacing:1px
}

.gps{
  font-size:11px;
  color:#b9e5a8
}

.map{
  height:370px;
  flex:0 0 370px;
  position:relative;
  overflow:hidden;
  background:#e5e1d8
}

.water{
  position:absolute;
  left:-18%;
  top:-10%;
  height:125%;
  width:38%;
  background:#c7dce0;
  transform:rotate(8deg)
}

.grid{
  position:absolute;
  inset:-50px;
  background:
    linear-gradient(12deg,transparent 47%,#fff 48%,#fff 51%,transparent 52%),
    linear-gradient(102deg,transparent 47%,#d4d0c8 48%,#d4d0c8 50%,transparent 51%);
  background-size:115px 82px;
  transform:rotate(-8deg);
  opacity:.9
}

.route{
  position:absolute;
  left:27%;
  top:25%;
  width:48%;
  height:54%;
  border-left:5px solid #111;
  border-bottom:5px solid #111;
  border-radius:0 0 0 80px;
  transform:rotate(-18deg)
}

.marker{
  position:absolute;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#fff;
  border:5px solid #111;
  box-shadow:0 2px 8px #777
}

.m1{left:63%;top:25%}
.m2{left:56%;top:38%}
.m3{left:50%;top:49%}
.m4{left:43%;top:61%}
.m5{left:36%;top:72%}

.you{
  position:absolute;
  left:59%;
  top:34%;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#2677ff;
  border:4px solid #fff;
  box-shadow:0 0 0 6px #2677ff33
}

.mapcard{
  position:absolute;
  top:14px;
  left:14px;
  background:#fff;
  border-radius:15px;
  padding:10px 12px;
  box-shadow:0 4px 15px #0002;
  font-size:12px;
  font-weight:800
}

.locate{
  position:absolute;
  right:14px;
  bottom:14px;
  width:44px;
  height:44px;
  border-radius:50%;
  background:#fff;
  border:0;
  font-size:19px;
  box-shadow:0 4px 15px #0002
}

.sheet{
  margin-top:-18px;
  position:relative;
  background:#fff;
  border-radius:24px 24px 0 0;
  padding:12px 16px 0;
  min-height:0;
  flex:1 1 auto;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  z-index:2
}

.stageHeader{
  flex:0 0 auto;
  background:#fff;
  padding:2px 2px 10px;
  border-bottom:1px solid #eeeae4;
  position:relative;
  z-index:5
}

.eyebrow{
  font-size:10px;
  color:#777;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.7px
}

.stageHeader h1{
  font-size:21px;
  line-height:1.15;
  margin:3px 0 0
}

.storyWrap{
  display:none
}

.storyWrap::-webkit-scrollbar{
  width:4px
}

.storyWrap::-webkit-scrollbar-thumb{
  background:#d0ccc4;
  border-radius:10px
}

.story{
  font-size:15px;
  line-height:1.55;
  color:#333
}

.progress{
  height:4px;
  background:#e7e4de;
  border-radius:5px;
  margin:15px 0
}

.progress b{
  display:block;
  height:100%;
  background:#111;
  border-radius:5px;
  width:12.5%
}

.meta{
  display:flex;
  justify-content:space-between;
  color:#777;
  font-size:11px
}

.controls{
  margin-top:auto;
  flex:0 0 auto;
  background:#fff;
  padding:10px 0 calc(10px + env(safe-area-inset-bottom));
  position:relative;
  z-index:20;
  border-top:1px solid #eeeae4
}

.playerProgress{
  height:4px;
  background:#e6e2dc;
  border-radius:8px;
  margin:0 4px 7px;
  overflow:hidden
}

.playerProgressFill{
  display:block;
  width:0%;
  height:100%;
  background:#111;
  border-radius:8px;
  transition:width .08s linear
}

.playerTime{
  display:flex;
  justify-content:space-between;
  padding:0 5px;
  margin-bottom:6px;
  color:#8a867f;
  font-size:9px;
  font-weight:700
}

.playerNav{
  display:grid;
  grid-template-columns:74px minmax(0,1fr) 74px;
  gap:7px;
  align-items:stretch
}

.navBtn{
  min-width:0;
  height:66px;
  border:0;
  border-radius:16px;
  padding:6px 4px;
  font-weight:900;
  font-size:10px;
  background:#eeeae2;
  color:#151515;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px
}

.navBtn:active,
.cameraBtn:active,
.mic:active,
.mainListen:active,
.captureBtn:active{
  transform:scale(.98)
}

.playerIcon{
  font-size:17px;
  line-height:1
}

.navHint{
  display:block;
  font-size:8px;
  line-height:1.05;
  font-weight:600;
  color:#8a867f
}

.mainListen{
  width:100%;
  height:66px;
  margin:0;
  padding:8px 8px;
  border-radius:18px;
  background:#111;
  color:#fff;
  border:0;
  font-weight:900;
  font-size:13px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  line-height:1.05;
  box-shadow:0 4px 14px #00018
}

.mainListen.speaking{
  background:#171717
}

.playIcon{
  font-size:23px;
  line-height:1;
  margin-bottom:2px
}

.playLabel{
  font-size:13px;
  line-height:1.05
}

.mainListen .sub{
  display:block;
  font-size:8px;
  font-weight:500;
  opacity:.62;
  margin-top:3px;
  line-height:1.05
}

.mic{
  width:100%;
  height:52px;
  margin-top:7px;
  border-radius:15px;
  border:0;
  background:#111;
  color:#fff;
  font-size:12px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  box-shadow:0 4px 14px #0002
}

.mic.recording{
  animation:pulse 1s infinite;
  background:#c9b48b;
  color:#111
}

.mic.processing{
  background:#ddd7cc;
  color:#111;
  animation:none
}

.mic span{
  font-size:12px
}

@keyframes pulse{
  50%{transform:scale(1.03);opacity:.8}
}

.cameraBtn{
  width:100%;
  height:52px;
  margin-top:7px;
  padding:8px;
  border:0;
  border-radius:15px;
  background:#eeeae2;
  color:#151515;
  font-weight:900;
  font-size:12px
}

/* ВАЖНО:
   Статус микрофона больше не занимает отдельную строку.
   Поэтому меню не сдвигается вверх/вниз.
*/
.voiceStatus{
  display:none!important
}

.smallNote{
  font-size:11px;
  color:#888;
  line-height:1.4;
  margin-top:10px
}

/* FIX — стабильная архитектура */
.storyWrap{
  scrollbar-gutter:stable
}

/* ПАНЕЛЬ "ЧТО Я ВИЖУ?" */
.panelBackdrop{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:40;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease
}

.panelBackdrop.show{
  opacity:1;
  pointer-events:auto
}

.panelBackdrop{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:40;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease
}

.panelBackdrop.show{
  opacity:1;
  pointer-events:auto
}

.panel{
  position:fixed;
  left:50%;
  top:0;
  bottom:0;
  transform:translate(-50%,100%);
  width:min(430px,100vw);
  height:100dvh;
  overflow:hidden;
  padding:0;
  border-radius:0;
  background:#111;
  z-index:50;
  box-shadow:0 -12px 35px #0006;
  transition:transform .24s ease;
  visibility:hidden;
  display:flex;
  flex-direction:column
}

.panel.show{
  transform:translate(-50%,0);
  visibility:visible
}

.panel h2{
  margin:0;
  font-size:0;
  line-height:0
}

.panel p{
  font-size:14px;
  line-height:1.5
}

.panelClose{
  position:absolute;
  top:calc(12px + env(safe-area-inset-top));
  left:12px;
  z-index:8;
  width:auto;
  min-width:112px;
  height:40px;
  padding:0 14px;
  border:0;
  background:#fff;
  color:#151515;
  border-radius:22px;
  font-size:12px;
  font-weight:900;
  box-shadow:0 4px 18px #0005
}

.cameraTopHint{
  position:absolute;
  top:calc(12px + env(safe-area-inset-top));
  right:12px;
  z-index:8;
  height:40px;
  min-width:40px;
  padding:0 12px;
  border:0;
  border-radius:22px;
  background:#111b;
  color:#fff;
  font-size:11px;
  font-weight:800;
  backdrop-filter:blur(8px)
}

.visionMedia{
  position:relative;
  width:100%;
  flex:1 1 auto;
  min-height:0;
  border-radius:0;
  overflow:hidden;
  background:#111;
  margin:0
}

.visionMedia video,
.visionMedia img{
  display:none;
  width:100%;
  height:100%;
  max-height:none;
  object-fit:cover;
  background:#111
}

.visionMedia.live video{
  display:block
}

.visionMedia.hasPhoto img{
  display:block
}

#cam{
  display:none;
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:0
}

.visionText{
  position:absolute;
  left:14px;
  right:14px;
  bottom:calc(92px + env(safe-area-inset-bottom));
  z-index:7;
  max-height:32dvh;
  overflow:auto;
  padding:13px 15px;
  border-radius:17px;
  background:#111d;
  color:#fff;
  backdrop-filter:blur(10px);
  font-size:13px;
  line-height:1.45;
  box-shadow:0 5px 20px #0005
}

.visionTitle{
  font-size:18px;
  font-weight:900;
  margin-bottom:6px
}

.visionDesc{
  font-size:13px;
  line-height:1.5
}

.visionLoading{
  display:flex;
  align-items:center;
  gap:8px;
  font-weight:800
}

.visionDot{
  width:9px;
  height:9px;
  flex:0 0 9px;
  border-radius:50%;
  background:#fff;
  animation:vdot 1s infinite
}

@keyframes vdot{
  50%{opacity:.25;transform:scale(.7)}
}

.visionActions,
.visionResultActions{
  display:none!important
}

.captureBtn{
  display:none;
  position:absolute;
  left:50%;
  bottom:calc(14px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  z-index:10;
  width:82px;
  height:82px;
  margin:0;
  padding:0;
  border:5px solid #fff;
  border-radius:50%;
  background:#fff;
  color:#111;
  font-weight:900;
  font-size:0;
  box-shadow:0 5px 22px #0008
}

.captureBtn::after{
  content:'';
  position:absolute;
  inset:7px;
  border-radius:50%;
  border:2px solid #111;
  background:#fff
}

.panel.cameraLive .captureBtn{
  display:block!important
}

.panel.cameraLive .visionText{
  background:#1118;
  bottom:calc(106px + env(safe-area-inset-bottom));
  font-size:12px;
  padding:9px 12px;
  max-height:72px
}

.panel.cameraLive .visionMedia{
  flex:1 1 auto
}

.panel.photoResult .visionText{
  left:10px;
  right:10px;
  bottom:10px;
  max-height:40dvh;
  background:#fff;
  color:#151515;
  box-shadow:0 6px 24px #0005
}

.panel.photoResult .visionTitle{
  color:#111
}

.panel.photoResult .visionDesc{
  color:#383532
}

.panel.photoResult .captureBtn{
  display:none!important
}

.panel.photoResult .visionMedia img{
  object-fit:contain;
  background:#111
}

.panel.busy .visionText{
  opacity:.92
}

.panel button.full{
  width:100%;
  margin-top:8px;
  padding:11px;
  border:0;
  border-radius:13px;
  font-weight:800
}

.toast{
  position:fixed;
  bottom:112px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  color:#fff;
  padding:10px 13px;
  border-radius:14px;
  font-size:12px;
  z-index:60;
  max-width:90%;
  text-align:center
}

@media(max-width:430px){

  .sheet{
    padding-left:14px;
    padding-right:14px
  }

  .stageHeader{
    padding-bottom:9px
  }

  .stageHeader h1{
    font-size:20px
  }

  .controls{
    padding-top:7px
  }

  .map{
    height:370px;
    flex-basis:370px
  }

  .playerNav{
    grid-template-columns:70px minmax(0,1fr) 70px;
    gap:6px
  }

  .mainListen,
  .navBtn{
    height:68px
  }

  .mainListen{
    padding:8px 6px
  }

  .navBtn{
    padding:6px 3px
  }
}

.map{
  height:370px!important;
  flex-basis:370px!important
}

.sheet{
  flex:1 1 auto!important;
  min-height:0!important;
  overflow:hidden!important
}

.controls{
  margin-top:auto!important
}
</style>

<style>
/* Дополнительные стили камеры */
.visionMedia{
  width:100%;
  border-radius:16px;
  overflow:hidden;
  background:#e8e5df;
  margin-bottom:10px
}

.visionMedia video,
.visionMedia img{
  display:none;
  width:100%;
  max-height:36dvh;
  object-fit:cover;
  background:#111
}

.visionMedia.live video{
  display:block
}

.visionMedia.hasPhoto img{
  display:block
}
<style>
/* WALKAI V7 — камера на весь экран, кнопка фото закреплена снизу */
.panel.show{
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding:0 14px calc(78px + env(safe-area-inset-bottom));
  border-radius:22px 22px 0 0;
}

.panel.show h2{
  display:none;
}

.panel.show .panelClose{
  position:absolute;
  top:10px;
  left:14px;
  right:14px;
  width:calc(100% - 28px);
  margin:0;
  z-index:56;
  background:#f5f3efee;
  backdrop-filter:blur(6px);
}

.panel.show .visionMedia{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  margin:0;
  border-radius:0;
}

.panel.show .visionMedia.live{
  height:100%;
}

.panel.show .visionMedia.live video,
.panel.show #cam{
  width:100%;
  height:100%;
  max-height:none;
  min-height:0;
  object-fit:cover;
  border-radius:0;
}

.panel.show .visionMedia.hasPhoto{
  flex:0 0 auto;
  height:auto;
  max-height:55dvh;
}

.panel.show .visionMedia.hasPhoto img{
  width:100%;
  height:auto;
  max-height:55dvh;
  object-fit:contain;
  border-radius:0;
}

.panel.show .visionText{
  flex:0 0 auto;
  max-height:30dvh;
  overflow:auto;
  padding:12px 2px 8px;
}

.panel.show .captureBtn{
  position:fixed;
  left:14px;
  right:14px;
  bottom:calc(12px + env(safe-area-inset-bottom));
  width:calc(100% - 28px);
  height:58px;
  margin:0;
  z-index:57;
  border-radius:15px;
  font-size:15px;
  box-shadow:0 6px 22px #0004;
}

.panel.show .captureBtn{
  display:none;
}

.panel.show:has(.visionMedia.live) .captureBtn{
  display:block;
}

.panel.show .visionMedia.live + #photoInput + .visionText{
  position:absolute;
  left:24px;
  right:24px;
  bottom:82px;
  z-index:55;
  padding:8px 12px;
  border-radius:12px;
  background:#0008;
  color:#fff;
  font-size:12px;
  max-height:none;
  pointer-events:none;
}
</style>
<style>
/* WALKAI V7 — финальная компоновка кнопок и камеры */
.actionRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  width:100%;
  margin-top:8px;
}
.actionRow .mic,.actionRow .cameraBtn{
  width:100%;
  height:52px;
  min-width:0;
  margin:0;
  padding:0 8px;
  border:0;
  border-radius:15px;
  background:#111;
  color:#fff;
  font-size:12px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  box-shadow:0 4px 14px #00018;
}
.actionRow .cameraBtn{background:#eeeae2;color:#151515}
.actionIcon{font-size:16px;line-height:1}

/* Камера: действительно полноэкранная, без растянутых панелей */
.panel.show{
  padding:0 !important;
  border-radius:0 !important;
}
.panel.show .panelClose{
  top:calc(12px + env(safe-area-inset-top));
  left:12px;
  right:auto;
  width:40px;
  min-width:40px;
  height:40px;
  padding:0;
  border-radius:50%;
  background:#f5f3efee;
  color:#151515;
  font-size:0;
  box-shadow:0 4px 18px #0005;
}
.panel.show .panelClose::before{
  content:'←';
  font-size:20px;
  font-weight:900;
}
.panel.show .visionMedia{
  flex:1 1 auto !important;
  min-height:0 !important;
  width:100% !important;
  margin:0 !important;
  border-radius:0 !important;
}
.panel.show .visionMedia.live video{
  width:100%;
  height:100%;
  max-height:none;
  object-fit:cover;
}

/* Компактная круглая кнопка фото с подписью */
.panel.show .captureBtn,.panel.show:has(.visionMedia.live) .captureBtn{
  position:fixed;
  left:50%;
  right:auto;
  bottom:calc(8px + env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:118px;
  height:104px;
  padding:0;
  border:0;
  border-radius:0;
  background:transparent;
  color:#fff;
  font-size:11px;
  font-weight:900;
  box-shadow:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:5px;
}
.panel.show:has(.visionMedia.live) .captureBtn{display:flex !important}
.captureShutter{
  position:relative;
  display:block;
  width:72px;
  height:72px;
  flex:0 0 72px;
  border:4px solid #fff;
  border-radius:50%;
  background:#fff;
  box-shadow:0 5px 22px #0008;
}
.captureShutter::after{
  content:'';
  position:absolute;
  inset:7px;
  border-radius:50%;
  border:2px solid #111;
  background:#fff;
}
.captureLabel{
  display:block;
  padding:5px 10px;
  border-radius:12px;
  background:#111c;
  color:#fff;
  white-space:nowrap;
  line-height:1;
}
.panel.show:has(.visionMedia.live) .visionText{
  position:absolute;
  left:14px;
  right:14px;
  bottom:calc(108px + env(safe-area-inset-bottom));
  z-index:55;
  max-height:72px;
  padding:9px 12px;
  border-radius:14px;
  background:#111c;
  color:#fff;
  font-size:12px;
}

/* После снимка: фото не уходит под кнопку возврата */
.panel.show .visionMedia.hasPhoto{
  padding-top:58px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  box-sizing:border-box;
}
.panel.show .visionMedia.hasPhoto img{
  width:100%;
  height:100%;
  max-height:none;
  object-fit:contain;
}
.panel.show.photoResult .visionText{
  left:14px;
  right:14px;
  bottom:14px;
  max-height:38dvh;
  padding:13px 15px;
  border-radius:17px;
  background:#fff;
  color:#151515;
}

@media(max-width:430px){
  .actionRow{gap:7px}
  .actionRow .mic,.actionRow .cameraBtn{font-size:11px}
}
</style>

<style>
/* WALKAI V7 — финальная полировка навигации и камеры */

/* Все основные кнопки маршрута — единый цвет и единая логика */
.playerNav{
  grid-template-columns:74px minmax(0,1fr) 74px;
  gap:7px;
  align-items:stretch;
}

.playerNav .navBtn,
.playerNav .mainListen,
.actionRow .mic,
.actionRow .cameraBtn{
  background:#111 !important;
  color:#fff !important;
  border:0;
}

.playerNav .navBtn{

<script>

const data=[

  {
    t:'Галатская башня',
    s:'Остановитесь на секунду. Поднимите голову. Перед вами Галатская башня — один из самых узнаваемых ориентиров этой части Стамбула. Нынешняя башня связана с генуэзским периодом Галаты и была завершена в XIV веке. А история о полёте Хезарфена Челеби отсюда — знаменитый рассказ, который WALKAI обозначает именно как легенду.',
    n:'Камондо лестница',
    d:'280 м · 4 мин'
  },

  {
    t:'Камондо лестница',
    s:'Посмотрите на форму ступеней. Эта необычная лестница связана с семьёй Камондо и историей европейской Галаты XIX века. Её изгибы были не только красивыми — они помогали удобно соединить разные уровни улиц.',
    n:'Bankalar Caddesi',
    d:'350 м · 5 мин'
  },

  {
    t:'Bankalar Caddesi',
    s:'Сегодня это обычная городская улица. Но в XIX веке здесь концентрировалась финансовая жизнь османской Галаты. Здесь находились банки, страховые компании и торговые представительства.',
    n:'Истикляль',
    d:'700 м · 9 мин'
  },

  {
    t:'Истикляль',
    s:'Сейчас вокруг современный Стамбул. Но эта улица хранит несколько исторических слоёв — от Перы XIX века до сегодняшнего города. Попробуйте заметить, как рядом существуют разные архитектурные эпохи.',
    n:'Цветочный пассаж',
    d:'500 м · 7 мин'
  },

  {
    t:'Цветочный пассаж',
    s:'Оглянитесь вокруг. Это место связано с театральной и ресторанной историей Перы и пережило несколько эпох города. WALKAI может рассказать подробнее, если вы остановитесь здесь.',
    n:'Святой Антоний',
    d:'450 м · 6 мин'
  },

  {
    t:'Святой Антоний',
    s:'Перед нами одна из заметных католических церквей Бейоглу. Здесь особенно хорошо видна многослойность района: османский город, европейские общины и современный Стамбул существуют буквально на одной улице.',
    n:'Pera Palace',
    d:'800 м · 11 мин'
  },

  {
    t:'Pera Palace',
    s:'Представьте пассажиров Восточного экспресса, прибывающих в Константинополь. Отель открылся в 1895 году и стал частью истории Перы. Здесь можно сделать остановку и переключить WALKAI в режим «История вокруг меня».',
    n:'Таксим',
    d:'900 м · 12 мин'
  },

  {
    t:'Таксим',
    s:'Мы закончили маршрут. Но прогулка может продолжиться. WALKAI может подобрать следующий маршрут по времени, интересам и вашему темпу.',
    n:'Новый маршрут',
    d:'—'
  }

];

let i=0;
let audio=null;
let answerAudio=null;

// Предзагрузка первого рассказа: пока пользователь видит экран,
// браузер заранее получает аудио, чтобы после нажатия «Слушать гида»
// рассказ начинался значительно быстрее.
const storyAudioCache=new Map();
let storyPreloadPromise=null;
let recording=false;
let recorder=null;
let chunks=[];
let voiceCancelled=false;
let storyResumeActive=false;
let storyResumeIndex=-1;
let storyResumeTime=0;

const $=id=>document.getElementById(id);

function render(){

  const d=data[i];

  $('title').textContent=d.t;

  $('count').textContent=
    `Остановка ${i+1} из 8 · ${i?120:40} м`;

  if(!audio){
    setListenButton('▶','Продолжить','Нажмите, чтобы начать рассказ',false);
    updatePlayerProgress();
  }

}

function updatePlayerProgress(){

  const fill=$('playerProgressFill');
  const elapsed=$('playerElapsed');
  const remaining=$('playerRemaining');

  if(!fill || !elapsed || !remaining){
    return;
  }

  if(audio && Number.isFinite(audio.duration) && audio.duration>0){
    const cur=Math.max(0,Math.min(audio.currentTime||0,audio.duration));
    fill.style.width=((cur/audio.duration)*100)+'%';
    elapsed.textContent=formatTime(cur);
    remaining.textContent='−'+formatTime(Math.max(0,audio.duration-cur));
  }else{
    fill.style.width='0%';
    elapsed.textContent='0:00';
    remaining.textContent='—';
  }
}

function formatTime(sec){
  sec=Math.max(0,Math.round(Number(sec)||0));
  const m=Math.floor(sec/60);
  const s=String(sec%60).padStart(2,'0');
  return m+':'+s;
}

function setListenButton(icon,label,sub,speaking=false){
  const b=$('listen');
  b.classList.toggle('speaking',!!speaking);
  b.innerHTML=
    '<span class="playIcon">'+icon+'</span>'+
    '<span class="playLabel">'+label+'</span>'+
    '<span class="sub">'+sub+'</span>';
}

function stopAudio(){

  if(audio){
    audio.pause();
    audio.currentTime=0;
    audio=null;
  }

  if(answerAudio){
    answerAudio.pause();
    answerAudio.currentTime=0;
    answerAudio=null;
  }

  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
  }

  setListenButton('▶','Продолжить','Нажмите, чтобы начать рассказ',false);
  updatePlayerProgress();

}

function pauseStoryForQuestion(){

  if(
    audio &&
    !audio.paused &&
    !audio.ended &&
    Number.isFinite(audio.currentTime)
  ){

    storyResumeActive=true;
    storyResumeIndex=i;
    storyResumeTime=audio.currentTime;

    audio.pause();

    setListenButton('⏸','Пауза','Вопрос гиду — продолжу после ответа',true);

  }else{

    storyResumeActive=false;
    storyResumeIndex=-1;
    storyResumeTime=0;

  }

}

function resumeStoryAfterQuestion(){

  if(
    !storyResumeActive ||
    storyResumeIndex!==i ||
    !audio
  ){

    storyResumeActive=false;
    storyResumeIndex=-1;
    storyResumeTime=0;
    return;

  }

  const resumeAudio=audio;
  const resumeIndex=storyResumeIndex;
  const pos=storyResumeTime;

  storyResumeActive=false;
  storyResumeIndex=-1;
  storyResumeTime=0;

  // audio уже стоит ровно на месте паузы. Повторный currentTime=...
  // здесь не нужен: он заставляет браузер заново делать seek и даёт
  // заметную длинную паузу перед продолжением.
  setListenButton('⏸','Продолжаем…','Гид продолжит автоматически',true);

  // Небольшая пауза отделяет ответ на вопрос от продолжения рассказа.
  window.setTimeout(()=>{

    if(
      audio!==resumeAudio ||
      i!==resumeIndex
    ){
      return;
    }

    try{

      // Восстанавливаем позицию только если браузер почему-то её изменил.
      if(
        Number.isFinite(pos) &&
        Math.abs((resumeAudio.currentTime||0)-pos)>.05
      ){
        resumeAudio.currentTime=pos;
      }

      const playPromise=resumeAudio.play();

      if(playPromise?.catch){
        playPromise.catch(()=>{
          stopAudio();
        });
      }

    }catch(e){

      stopAudio();

    }

  },500);

}

async function preloadStoryAudio(text){

  if(!text || storyAudioCache.has(text)){
    return storyAudioCache.get(text)||null;
  }

  if(storyPreloadPromise && storyPreloadPromise.text===text){
    return storyPreloadPromise.promise;
  }

  const promise=(async()=>{
    try{
      const r=await fetch(
        '/api/tts',
        {
          method:'POST',
          headers:{
            'Content-Type':'application/json'
          },
          body:JSON.stringify({text})
        }
      );

      if(!r.ok){
        throw new Error('TTS '+r.status);
      }

      const blob=await r.blob();
      const url=URL.createObjectURL(blob);
      storyAudioCache.set(text,url);
      return url;
    }catch(e){
      return null;
    }
  })();

  storyPreloadPromise={text,promise};
  return promise;
}

async function speak(text){

  stopAudio();

  setListenButton('⏸','Пауза','Нажмите, чтобы продолжить',true);
  updatePlayerProgress();

  try{

    const cachedUrl=await preloadStoryAudio(text);

    if(!cachedUrl){
      throw new Error('TTS preload');
    }

    audio=new Audio(cachedUrl);

    audio.ontimeupdate=updatePlayerProgress;
    audio.onloadedmetadata=updatePlayerProgress;
    audio.onended=()=>stopAudio();

    audio.onerror=()=>{
      throw new Error('audio')
    };

    await audio.play();

  }catch(e){

    if('speechSynthesis' in window){

      const u=new SpeechSynthesisUtterance(text);

      u.lang='ru-RU';
      u.rate=.96;
      u.pitch=1;

      u.onend=()=>stopAudio();

      u.onerror=()=>{
        stopAudio();
        toast('Не удалось включить звук')
      };

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);

    }else{

      stopAudio();

      toast(
        'В этом браузере нет поддержки озвучки'
      );

    }

  }

}

async function speakAnswer(text){

  if(!text){
    resumeStoryAfterQuestion();
    return;
  }

  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
  }

  if(answerAudio){
    answerAudio.pause();
    answerAudio.currentTime=0;
    answerAudio=null;
  }

  setListenButton('🔊','Гид отвечает…','После ответа продолжу рассказ',true);

  try{

    const r=await fetch(
      '/api/tts',
      {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({text})
      }
    );

    if(!r.ok){
      throw new Error('TTS '+r.status);
    }

    const blob=await r.blob();

    answerAudio=new Audio(
      URL.createObjectURL(blob)
    );

    answerAudio.onended=()=>{
      answerAudio=null;
      resumeStoryAfterQuestion();
    };

    answerAudio.onerror=()=>{
      answerAudio=null;
      resumeStoryAfterQuestion();
    };

    await answerAudio.play();

  }catch(e){

    answerAudio=null;

    if('speechSynthesis' in window){

      const u=new SpeechSynthesisUtterance(text);

      u.lang='ru-RU';
      u.rate=.96;
      u.pitch=1;

      u.onend=()=>resumeStoryAfterQuestion();

      u.onerror=()=>{
        resumeStoryAfterQuestion();
        toast('Не удалось включить звук');
      };

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);

    }else{

      resumeStoryAfterQuestion();

      toast(
        'В этом браузере нет поддержки озвучки'
      );

    }

  }

}

function listenStory(){

  if(recording || answerAudio){
    return;
  }

  if(audio){

    if(audio.ended){
      stopAudio();
      speak(data[i].s);
      return;
    }

    if(audio.paused){

      audio.play().then(()=>{
        setListenButton('⏸','Пауза','Нажмите, чтобы поставить на паузу',true);
      }).catch(()=>{});

    }else{

      audio.pause();
      setListenButton('▶','Продолжить','Нажмите, чтобы продолжить',true);

    }

    return;
  }

  if(
    'speechSynthesis' in window &&
    window.speechSynthesis.speaking
  ){

    if(window.speechSynthesis.paused){
      window.speechSynthesis.resume();
      setListenButton('⏸','Пауза','Нажмите, чтобы поставить на паузу',true);
    }else{
      window.speechSynthesis.pause();
      setListenButton('▶','Продолжить','Нажмите, чтобы продолжить',true);
    }

    return;
  }

  speak(data[i].s);

}

  stopRecording();

    $('storyWrap')?.scrollTo({

  }

}

function next(){

  stopRecording();

    });

  }

}


/* =========================
   КАМЕРА
========================= */

let visionResult={
  title:'',
  description:''
};

function camera(){

  const p=$('camPanel');
  const b=$('panelBackdrop');

  const open=!p.classList.contains('show');

  p.classList.toggle('show',open);
  b.classList.toggle('show',open);

  if(open){

    // Останавливаем рассказ, чтобы камера и ответ AI не перекрывались.
    stopAudio();
    resetVision();

    // Сразу после открытия запускаем камеру.
    // Небольшая задержка нужна, чтобы панель успела появиться.
    window.setTimeout(()=>{
      if(p.classList.contains('show')){
        startCam();
      }
    },120);

  }else{

    stopCam();

  }

}

function resetVision(){

  stopCam();

  visionResult={
    title:'',
    description:''
  };

  $('visionMedia').classList.remove(
    'live',
    'hasPhoto'
  );

  $('photo').style.display='none';
  $('cam').style.display='none';

  $('captureBtn').style.display='none';

  $('camPanel').classList.remove('busy','cameraLive','photoResult');

  $('vision').textContent=
    'Включаю камеру…';

}

function stopCam(){

  const v=$('cam');

  if(v.srcObject){

    v.srcObject
      .getTracks()
      .forEach(t=>t.stop());

    v.srcObject=null;

  }

  v.style.display='none';

  $('visionMedia').classList.remove('live');

  $('captureBtn').style.display='none';

}

async function startCam(){

  if(
    $('camPanel').classList.contains('busy')
  ){
    return;
  }

  if(
    !window.isSecureContext ||
    !navigator.mediaDevices?.getUserMedia
  ){

    $('vision').innerHTML=
      '<strong>Камера требует защищённую страницу.</strong><br>Откройте WALKAI через HTTPS и повторите.';

    return;

  }

  try{

    stopCam();

    $('vision').textContent=
      'Запрашиваю доступ к камере…';

    const stream=
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:{
            ideal:'environment'
          },
          width:{
            ideal:1280
          },
          height:{
            ideal:720
          }
        },
        audio:false
      });

    const v=$('cam');

    v.srcObject=stream;

    v.style.display='block';

    $('visionMedia').classList.add('live');
    $('camPanel').classList.add('cameraLive');

    $('captureBtn').style.display='block';

    $('vision').textContent=
      'Наведите камеру на объект и нажмите «Сфотографировать».';

  }catch(e){

    $('vision').innerHTML=
      '<strong>Не удалось включить камеру.</strong><br>Разрешите доступ к камере для WALKAI в настройках браузера.';

  }

}

function capturePhoto(){

  const v=$('cam');

  if(
    !v.srcObject ||
    !v.videoWidth
  ){

    toast(
      'Камера ещё не готова'
    );

    return;

  }

  const c=document.createElement('canvas');

  const max=1600;

  const scale=Math.min(
    1,
    max/v.videoWidth
  );

  c.width=Math.round(
    v.videoWidth*scale
  );

  c.height=Math.round(
    v.videoHeight*scale
  );

  c.getContext('2d').drawImage(
    v,
    0,
    0,
    c.width,
    c.height
  );

  c.toBlob(
    blob=>{

      if(!blob)return;

      stopCam();

      const f=new File(
        [blob],
        'walkai-photo.jpg',
        {
          type:'image/jpeg'
        }
      );

      analyzeVisionFile(f);

    },
    'image/jpeg',
    .88
  );

}

async function photoTaken(input){

  const f=input.files?.[0];

  if(f){
    await analyzeVisionFile(f);
  }

  input.value='';

}

async function analyzeVisionFile(file){

  const media=$('visionMedia');
  const img=$('photo');

  media.classList.remove('live');
  media.classList.add('hasPhoto');
  $('camPanel').classList.add('photoResult');

  img.src=URL.createObjectURL(file);
  img.style.display='block';

  $('camPanel').classList.add('busy');

  $('vision').innerHTML=
    '<div class="visionLoading"><span class="visionDot"></span> AI анализирует фотографию…</div>';

  const place=data[i].t;

  try{

    const fd=new FormData();

    fd.append(
      'image',
      file,
      'walkai-photo.jpg'
    );

    fd.append(
      'place',
      place
    );

    fd.append(
      'context',
      data[i].s
    );

    const r=await fetch(
      '/api/vision',
      {
        method:'POST',
        body:fd
      }
    );

    if(!r.ok){
      throw new Error(
        await r.text()
      );
    }

    const x=await r.json();

    visionResult={
      title:x.title ||
        'Объект на фото',

      description:x.description ||
        ''
    };

    $('vision').innerHTML=
      '<div class="visionTitle">'+
      escapeHtml(
        visionResult.title
      )+
      '</div>'+
      '<div class="visionDesc">'+
      escapeHtml(
        visionResult.description
      )+
      '</div>';

    // После анализа сразу показываем результат и озвучиваем его.
    await speakVision();

  }catch(e){

    visionResult={
      title:
        'Не удалось определить объект',

      description:
        'AI не получил результат. Проверьте соединение с сервером и OPENAI_API_KEY, затем попробуйте ещё раз.'
    };

    $('vision').innerHTML=
      '<div class="visionTitle">Не удалось определить объект</div>'+
      '<div class="visionDesc">'+
      escapeHtml(
        visionResult.description
      )+
      '</div>';

  }finally{

    $('camPanel').classList.remove(
      'busy'
    );

  }

}

async function speakVision(){

  if(
    !visionResult.description
  ){
    return;
  }

  await speak(
    (
      visionResult.title
      ?
      visionResult.title+'. '
      :
      ''
    )+
    visionResult.description
  );

}

async function visionDetail(){

  if(
    !visionResult.title
  ){
    return;
  }

  const btns=
    $('visionResultActions');

  btns.style.opacity='.55';
  btns.style.pointerEvents='none';

  $('vision').innerHTML=
    '<div class="visionTitle">'+
    escapeHtml(
      visionResult.title
    )+
    '</div>'+
    '<div class="visionLoading"><span class="visionDot"></span> Гид готовит подробный рассказ…</div>';

  try{

    const fd=new FormData();

    fd.append(
      'title',
      visionResult.title
    );

    fd.append(
      'description',
      visionResult.description
    );

    fd.append(
      'place',
      data[i].t
    );

    fd.append(
      'context',
      data[i].s
    );

    const r=await fetch(
      '/api/vision-detail',
      {
        method:'POST',
        body:fd
      }
    );

    if(!r.ok){
      throw new Error(
        await r.text()
      );
    }

    const x=await r.json();

    visionResult.description=
      x.description ||
      visionResult.description;

    $('vision').innerHTML=
      '<div class="visionTitle">'+
      escapeHtml(
        visionResult.title
      )+
      '</div>'+
      '<div class="visionDesc">'+
      escapeHtml(
        visionResult.description
      )+
      '</div>';

    await speak(
      visionResult.description
    );

  }catch(e){

    toast(
      'Не удалось получить подробный рассказ. Проверьте сервер.'
    );

  }finally{

    btns.style.opacity='1';
    btns.style.pointerEvents='auto';

  }

}

function escapeHtml(v){

  return String(
    v??''
  ).replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );

}


/* =========================
   МИКРОФОН
========================= */

function setMicState(state){

  const b=$('micBtn');

  b.classList.remove(
    'recording',
    'processing'
  );

  if(state==='recording'){

    b.classList.add('recording');

    b.innerHTML=
      '● <span>Слушаю…</span>';

    b.setAttribute(
      'aria-label',
      'Идёт запись вопроса'
    );

  }else if(state==='processing'){

    b.classList.add('processing');

    b.innerHTML=
      '⌛ <span>Обрабатываю…</span>';

    b.setAttribute(
      'aria-label',
      'Обрабатываю вопрос'
    );

  }else{

    b.innerHTML=
      '🎙 <span>Вопрос гиду</span>';

    b.setAttribute(
      'aria-label',
      'Вопрос гиду'
    );

  }

}

async function startVoiceQuestion(){

  if(recording){

    voiceCancelled=true;

    stopRecording();

    setMicState('');

    $('voiceStatus')
      .classList.remove('show');

    toast(
      'Вопрос отменён'
    );

    resumeStoryAfterQuestion();
    return;

  }
  pauseStoryForQuestion();
  voiceCancelled=false;

  if(!window.isSecureContext){

    toast(
      'Микрофон работает только через HTTPS.'
    );

    return;

  }

  const SR=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(SR){

    try{

      const r=new SR();

      r.lang='ru-RU';

      r.interimResults=false;

      r.maxAlternatives=1;

      recorder=r;

      recording=true;

      setMicState(
        'recording'
      );

      r.onresult=async e=>{

        if(voiceCancelled){
          return;
        }

        const text=
          e.results?.[0]?.[0]
            ?.transcript ||
          '';

        recording=false;

        if(!text){

          setMicState('');
          resumeStoryAfterQuestion();

          return;

        }

        setMicState(
          'processing'
        );

        await askAIText(text);

      };

      r.onerror=e=>{

        recording=false;

        setMicState('');

        if(
          e.error!=='aborted'
        ){

          toast(
            e.error==='not-allowed'
            ?
            'Разрешите микрофон для WALKAI в браузере.'
            :
            'Не удалось распознать вопрос'
          );

          resumeStoryAfterQuestion();

        }else if(voiceCancelled){

          resumeStoryAfterQuestion();

        }

      };

      r.onend=()=>{

        if(recording){

          recording=false;

          if(!voiceCancelled){
            setMicState('');
          }

        }

      };

      r.start();

      return;

    }catch(e){

      recording=false;

      setMicState('');

    }

  }

  if(
    !navigator.mediaDevices?.getUserMedia
  ){

    toast(
      'Браузер не даёт доступ к микрофону. Попробуйте Chrome на Android.'
    );

    resumeStoryAfterQuestion();
    return;

  }

  try{

    const stream=
      await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        }
      });

    chunks=[];

    const mime=
      MediaRecorder.isTypeSupported(
        'audio/webm;codecs=opus'
      )
      ?
      'audio/webm;codecs=opus'
      :
      'audio/webm';

    recorder=
      new MediaRecorder(
        stream,
        {
          mimeType:mime
        }
      );

    recording=true;

    voiceCancelled=false;

    setMicState(
      'recording'
    );

    recorder.ondataavailable=e=>{

      if(e.data.size){
        chunks.push(e.data);
      }

    };

    recorder.onstop=async()=>{

      stream
        .getTracks()
        .forEach(
          t=>t.stop()
        );

      if(voiceCancelled){

        chunks=[];

        setMicState('');

        return;

      }

      const blob=
        new Blob(
          chunks,
          {
            type:mime
          }
        );

      setMicState(
        'processing'
      );

      await askAI(blob);

      setMicState('');

    };

    recorder.start();

  }catch(e){

    recording=false;

    setMicState('');

    toast(
      'Не удалось включить микрофон'
    );

    resumeStoryAfterQuestion();

  }

}

function stopRecording(){

  if(
    !recorder ||
    !recording
  ){
    return;
  }

  try{

    if(
      typeof recorder.stop==='function'
    ){

      recorder.stop();

    }else if(
      typeof recorder.abort==='function'
    ){

      recorder.abort();

    }

  }catch(e){}

  recording=false;

}

async function askAIText(text){

  setMicState(
    'processing'
  );

  try{

    const fd=new FormData();

    fd.append(
      'text',
      'Ответь на вопрос пользователя строго по существу. Если вопрос требует одного факта, числа, даты или названия — дай только этот ответ с необходимой единицей измерения. Не добавляй историю, легенды, полёт Хезарфена, контекст, примеры, вступление или заключение. Максимум 1–2 коротких предложения. Не повторяй вопрос. Вопрос пользователя: '+text
    );

    fd.append(
      'place',
      data[i].t
    );

    fd.append(
      'context',
      data[i].s
    );

    const r=await fetch(
      '/api/ask-text',
      {
        method:'POST',
        body:fd
      }
    );

    if(!r.ok){

      throw new Error(
        await r.text()
      );

    }

    const x=await r.json();

    await speakAnswer(
      x.answer||''
    );

  }catch(e){

    resumeStoryAfterQuestion();

    toast(
      'Не удалось получить ответ гида. Проверьте сервер и OPENAI_API_KEY.'
    );

  }finally{

    setMicState('');

  }

}

async function askAI(blob){

  setMicState(
    'processing'
  );

  try{

    const fd=new FormData();

    fd.append(
      'audio',
      blob,
      'question.webm'
    );

    fd.append(
      'instruction',
      'Ответь на вопрос строго по существу. Если нужен один факт, число, дата или название — дай только его. Не добавляй историю, легенды, контекст, примеры или вступление. Максимум 1–2 коротких предложения.'
    );

    fd.append(
      'place',
      data[i].t
    );

    fd.append(
      'context',
      data[i].s
    );

    const r=await fetch(
      '/api/ask',
      {
        method:'POST',
        body:fd
      }
    );

    if(!r.ok){

      throw new Error(
        await r.text()
      );

    }

    const x=await r.json();

    await speakAnswer(
      x.answer||''
    );

  }catch(e){

    resumeStoryAfterQuestion();

    toast(
      'Не удалось получить ответ гида. Проверьте сервер и OPENAI_API_KEY.'
    );

  }finally{

    setMicState('');

  }

}

/* =========================
   TOAST
========================= */

function toast(t){

  const old=$('toast');

  if(old){
    old.remove();
  }

  const el=
    document.createElement('div');

  el.id='toast';

  el.className='toast';

  el.textContent=t;

  document.body.appendChild(el);

  setTimeout(
    ()=>el.remove(),
    3200
  );

}
